<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200">
  <defs>
    <linearGradient id="bgPr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="50%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#1a0505"/>
    </linearGradient>
    <linearGradient id="accentPr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff0033"/>
      <stop offset="100%" style="stop-color:#ff3366"/>
    </linearGradient>
    <linearGradient id="scanlinePr" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:transparent"/>
      <stop offset="50%" style="stop-color:#ff0033;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:transparent"/>
    </linearGradient>
    <filter id="glowPr"><feGaussianBlur stdDeviation="2"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowStrongPr"><feGaussianBlur stdDeviation="5"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="clipPr"><rect width="900" height="200" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#clipPr)">
    <rect width="900" height="200" rx="16" fill="url(#bgPr)"/>
    <rect width="900" height="200" rx="16" fill="none" stroke="#ff0033" stroke-width="1" opacity="0.3"/>
    <g opacity="0.04">
      <line x1="0" y1="40" x2="900" y2="40" stroke="#ff0033" stroke-width="1"/>
      <line x1="0" y1="80" x2="900" y2="80" stroke="#ff0033" stroke-width="1"/>
      <line x1="0" y1="120" x2="900" y2="120" stroke="#ff0033" stroke-width="1"/>
      <line x1="0" y1="160" x2="900" y2="160" stroke="#ff0033" stroke-width="1"/>
    </g>
    <rect x="0" y="0" width="900" height="200" fill="url(#scanlinePr)" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/>
    </rect>
    <line x1="0" y1="0" x2="0" y2="200" stroke="#ff0033" stroke-width="1" opacity="0">
      <animate attributeName="x1" values="60;840" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="60;840" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0" dur="4s" repeatCount="indefinite"/>
    </line>
    <g transform="translate(50,100)">
      <g filter="url(#glowPr)">
        <text x="0" y="-10" font-family="monospace" font-size="10" fill="#666" letter-spacing="4">&gt; dont-get-hacked-openclaw</text>
        <circle cx="0" cy="0" r="30" fill="none" stroke="#ff0033" stroke-width="1" opacity="0.2">
          <animate attributeName="r" values="25;35" dur="2s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.2;0.05;0.2" dur="2s" repeatCount="indefinite"/>
        </circle>
        <circle cx="0" cy="0" r="3" fill="#ff0033">
          <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
        </circle>
        <g stroke="#ff0033" stroke-width="1" opacity="0.3" fill="none">
          <path d="M3,0 L20,12"/>
          <path d="M3,0 L20,-12"/>
          <path d="M-3,0 L-20,12"/>
          <path d="M-3,0 L-20,-12"/>
        </g>
        <circle cx="0" cy="0" r="45" fill="none" stroke="#ff0033" stroke-width="0.5" opacity="0">
          <animate attributeName="r" values="30;55" dur="2.5s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.15;0" dur="2.5s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>
    <g transform="translate(150,50)">
      <text x="0" y="0" font-family="monospace" font-size="14" fill="#888">&gt; <tspan fill="#ff0033">./dont-get-hacked-openclaw</tspan></text>
      <text x="0" y="32" font-family="monospace" font-size="38" font-weight="bold" fill="#ff0033" filter="url(#glowStrongPr)">
        DONT-GET-HACKED-OPENCLAW
      </text>
      <text x="0" y="32" font-family="monospace" font-size="38" font-weight="bold" fill="#ff0033" opacity="0.2">
        <animate attributeName="opacity" values="0.2;0.5;0.2" dur="0.04s" repeatCount="indefinite"/>
        DONT-GET-HACKED-OPENCLAW
      </text>
      <text x="0" y="65" font-family="monospace" font-size="14" fill="#aaa" letter-spacing="2">VPS HARDENING GUIDE</text>
      <text x="0" y="88" font-family="monospace" font-size="14" fill="#aaa" letter-spacing="2">HOW TO LOCK DOWN A VPS FOR AI AGENTS</text>
      <text x="0" y="115" font-family="monospace" font-size="11" fill="#666" letter-spacing="1">dont-get-hacked-openclaw</text>
    </g>
    <g transform="translate(780, 170)" opacity="0.3">
      <text font-family="monospace" font-size="9" fill="#ff0033">sinCodes11</text>
    </g>
    <g transform="translate(30, 178)" opacity="0.12">
      <line x1="0" y1="0" x2="25" y2="0" stroke="#ff0033" stroke-width="1"><animate attributeName="x2" values="0;25;0" dur="2s" repeatCount="indefinite"/></line>
      <line x1="0" y1="5" x2="15" y2="5" stroke="#ff0033" stroke-width="1"><animate attributeName="x2" values="0;15;0" dur="2.5s" repeatCount="indefinite"/></line>
    </g>
  </g>
</svg>
